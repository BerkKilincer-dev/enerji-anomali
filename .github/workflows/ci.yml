# Runs after every push and on pull requests; it reports problems but never blocks a push.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  test:
    runs-on: ubuntu-latest
    services:
      # Same image as docker-compose.yml, so the schema runs with TimescaleDB as in production.
      postgres:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: energy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owner -d energy_test"
          --health-interval 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://owner:ci-owner-password@localhost:5432/energy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r requirements.txt
      # Runs app.py headless: the login page must render without an error.
      - run: |
          python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('app.py').run(timeout=60)
          assert not at.exception, at.exception
          assert [t.label for t in at.text_input] == ['E-posta', 'Şifre']
          "
