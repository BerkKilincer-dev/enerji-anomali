# Local stack on 127.0.0.1. `docker compose up -d` fills the database on first start (setup)
# and runs live scoring, MQTT ingest and the live demo, which waits for the panel's start button.
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://${DB_TEAM_USER:-team}:${DB_TEAM_PASSWORD:?set DB_TEAM_PASSWORD in .env}@db:5432/${POSTGRES_DB:-energy}
    MQTT_HOST: mqtt
  depends_on:
    init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-energy}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  init:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-energy}
    command: ["python", "-m", "src.data.load_db", "--schema-only"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Fills the database without anyone installing Python or training: downloads LEAD, loads it,
  # loads the demo businesses from data/meter_catalog.csv and publishes the committed model. The first start takes a few minutes, later
  # ones seconds. Watch it with: docker compose logs -f setup
  setup:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-energy}
      DATA_DIR: /app/cache
      # Local demo only; older .env files do not have this line yet.
      DEMO_TENANT_PASSWORD: ${DEMO_TENANT_PASSWORD:-tenant-demo-pass}
    command:
      - sh
      - -c
      - python -m src.data.load_db && python -m src.data.catalog && python -m src.models.publish --if-missing
    volumes:
      - datacache:/app/cache
      - ./models_out:/app/models_out:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"

  # Scores customer meters (not the LEAD history) as new hours arrive; a short interval keeps
  # the live demo's alarms close behind its fast play.
  scoring:
    <<: *app
    command: ["python", "-m", "src.scoring.service", "--interval", "20"]
    volumes:
      - ./models_out:/app/models_out:ro

  ingest:
    <<: *app
    command: ["python", "-m", "src.ingest.mqtt_ingest"]

  # Five virtual meters of "Canlı Demo Tesisi"; idle until an admin presses start in the panel.
  live-demo:
    <<: *app
    command: ["python", "-m", "src.ingest.live_demo"]
    environment:
      DATABASE_URL: postgresql://${DB_TEAM_USER:-team}:${DB_TEAM_PASSWORD:?set DB_TEAM_PASSWORD in .env}@db:5432/${POSTGRES_DB:-energy}
      MQTT_HOST: mqtt
      DEMO_TENANT_PASSWORD: ${DEMO_TENANT_PASSWORD:-tenant-demo-pass}
      # Real seconds per simulated hour while the demo catches up with the current hour.
      LIVE_DEMO_SECONDS_PER_HOUR: ${LIVE_DEMO_SECONDS_PER_HOUR:-60}

  dashboard:
    build: ./dashboard
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:5173:8501"
    volumes:
      - ./dashboard:/app
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
  datacache:
