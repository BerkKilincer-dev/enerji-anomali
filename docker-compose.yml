# Local stack on 127.0.0.1. `docker compose up -d` fills the database on first start (setup);
# `--profile live` adds live scoring and MQTT ingest.
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://${DB_TEAM_USER:-team}:${DB_TEAM_PASSWORD:?set DB_TEAM_PASSWORD in .env}@db:5432/${POSTGRES_DB:-energy}
    MQTT_HOST: mqtt
  depends_on:
    init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-energy}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  init:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-energy}
    command: ["python", "-m", "src.data.load_db", "--schema-only"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Fills the database without anyone installing Python or training: downloads LEAD, loads it
  # and publishes the committed model in models_out/. The first start takes a few minutes, later
  # ones seconds. Watch it with: docker compose logs -f setup
  setup:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-energy}
      DATA_DIR: /app/cache
    command: ["sh", "-c", "python -m src.data.load_db && python -m src.models.publish --if-missing"]
    volumes:
      - datacache:/app/cache
      - ./models_out:/app/models_out:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"

  scoring:
    <<: *app
    profiles: ["live"]
    command: ["python", "-m", "src.scoring.service", "--interval", "300"]
    volumes:
      - ./models_out:/app/models_out:ro

  ingest:
    <<: *app
    profiles: ["live"]
    command: ["python", "-m", "src.ingest.mqtt_ingest"]

  frontend:
    image: node:22.23.2-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - api

volumes:
  dbdata:
  datacache:
  frontend_modules:
